<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cr's Blog</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont/lxgwwenkaigbscreen.css">
<link rel="stylesheet" href="/assets/site.css">
<script type="module" src="/assets/page.js"></script>
<script type="module" src="/assets/home.js"></script>
</head>
<body>
<header class="site"><a class="name" href="/">Cr's Blog</a><nav><a href="/articles/">文章</a><a href="/essays/">随笔</a><a href="/notes/">速查</a><a href="/tools/">工具</a><a href="/archive/">归档</a></nav></header>
<main class="home">
  <p class="intro rise">笔记、随笔和一些小工具。</p>
  <div class="board rise" id="board" style="--i:1" aria-label="速查">
    <span class="board-label">速查</span>
    <div class="board-window"><ul class="board-list"></ul></div>
    <span class="board-nav"><button class="board-prev" aria-label="上一条">‹</button><button class="board-next" aria-label="下一条">›</button></span>
    <a class="board-all" href="/notes/"></a>
  </div>
  <section class="latest">
    <div class="col-h rise" style="--i:2"><span>最 近</span></div>
    <div class="feature" id="feature"></div>
  </section>
  <section class="more rise" style="--i:6">
    <div class="tabs seg" id="tabs"><button value="articles" aria-pressed="true">文章</button><button value="essays" aria-pressed="false">随笔</button><button value="tools" aria-pressed="false">工具</button></div>
    <div class="tab-stage" id="stage"></div>
  </section>
</main>
<footer class="site"><span>Cr's Blog</span><a href="/archive/">归档 →</a></footer>
</body>
</html>
