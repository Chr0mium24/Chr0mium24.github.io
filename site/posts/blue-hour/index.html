  <h1>蓝调时刻</h1>
  <div class="essay">
<p>青春流走，是晚上空旷大街和不甚相识的朋友在最后一次聚会后乘车返校。 眼睁睁看着胶卷显影 但自己没有头顶的灯亮眼，也没用周围的人出彩，看着上一瞬显现，下一刻被保存，自己除了无动于衷外改变不了青春的构图。审美的扩散是有限的。有人纹身，但没人在肝脏上雕花；有人摆拍 但不会求记忆借过。每天的太阳暴晒，让我所有照片的高光褪色，也将透明和模糊记忆蓝晒，层层叠叠，透过这些看到的是我人生的蓝调时刻。</p>
