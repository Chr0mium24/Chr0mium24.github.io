  <h1>FLCL(fooly cooly)</h1>
  <figure class="ph"><div class="ph-img" style="aspect-ratio:16/9"></div></figure>
  <div class="essay">
    <p>和zt用腾讯会议一起看完了，看的时候整个大脑放空<span class="aside">溜大了</span>。动画音乐都没话说，有点过于青春让鼠鼠自卑了。EVA的宗教背景和时代的迷茫是可解的<span class="aside">为什么</span>，但是FLCL在情节逻辑和剧中青春的狂乱是统一的，这点像《动物凶猛》。</p>
    <p>里面的meta已经没必要单独拎出来说，这种形式上的揉碎只是青春的声调，即使沙哑也能用吉他砸出。</p>
