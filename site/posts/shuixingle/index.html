  <h1>睡醒了</h1>
  <div class="essay">
    <p>这样吧，你打车导航到天德泵业，沿着兴园路进去看到第二个苍南县星海学校的石头牌子下车，大概离路口150米。学校里已经没人了，你直接绕过伸缩门，从保安室进去直走，沿着教学楼外壁走到最近的一个教室，抬头看到九（2）的牌子。如果这时候在上课，门是开着的，你喊一声报告进去，台上惊愕的穿格子衬衫的应该是退休了的班主任，或者是已经离职的化学老师。无论是谁，你陪着笑去和他握手，让他带着小蜜蜂回办公室，你留下来坐着。</p>
