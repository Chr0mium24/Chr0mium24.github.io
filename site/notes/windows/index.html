<main class="post">
  <div class="kicker"><span>速查</span><span>2026-01-23</span></div>
  <h1>Windows 装机清单</h1>
  <div class="note-body">
    <style>
      .note-body .win .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(13rem, 100%), 1fr)); gap: .2rem 1rem; }
      .note-body .win fieldset { border: 0; padding: 0; margin: 0 0 .5rem; min-width: 0; }
      .note-body .win legend { font: 600 .74rem var(--sans); color: var(--mute); letter-spacing: .1em; padding: 0; margin-bottom: .15rem; }
      .note-body .win label { display: flex; gap: .45rem; align-items: baseline; font-size: .84rem; line-height: 1.45; padding: .12rem 0; cursor: pointer; }
      .note-body .win input[type=checkbox] { accent-color: var(--hand); flex: none; transform: translateY(.1em); }
      .note-body .win label:hover span { color: var(--hand); }
      .note-body .win .presets { margin: .3rem 0 .2rem; }
      .note-body .win .presets .btn { font-size: .78rem; }
      .note-body .win .out { border-top: 1px dashed var(--line); margin-top: .8rem; padding-top: .3rem; font-size: .88rem; line-height: 1.65; }
      .note-body .win .out h4 { font: 600 .76rem var(--sans); color: var(--mute); letter-spacing: .1em; margin: .9rem 0 .25rem; }
      .note-body .win .out ol { margin: 0; padding-left: 1.4em; }
      .note-body .win .out li { margin: .15rem 0; overflow-wrap: anywhere; }
      .note-body .win .tip { font-size: .8rem; color: var(--ink2); }
      .note-body .win .blk { margin: .5rem 0; }
      .note-body .win .lab { display: flex; justify-content: space-between; align-items: flex-end; gap: .5rem; font-size: .76rem; color: var(--mute); margin-bottom: .2rem; }
      .note-body .win pre { margin: 0; font-size: 12px; max-height: 22rem; }
      .note-body .win .lab .btn { font-size: .72rem; padding: 0 .55rem; flex: none; }
      .note-body .win .notes { padding-left: 1.2em; font-size: .82rem; color: var(--ink2); }
      .note-body .win .notes pre { margin: .3rem 0; }
      .note-body .win .none { color: var(--mute); }
    </style>
    <p>重装 Win11 之后要装的软件、要改的设置和开发环境。勾上要的，下面直接生成你的清单：下载链接、手动步骤，命令按在哪运行分好组，复制就能用。</p>
    <figure class="play win" id="note-win" data-fig="/notes/windows/list.js">
      <div class="fig-body stack">
        <div class="fig-main">
          <div class="btns presets"><button type="button" class="btn" data-preset="fresh">刚装完系统</button><button type="button" class="btn" data-preset="dev">开发环境</button><button type="button" class="btn" data-preset="pretty">美化</button><button type="button" class="btn" data-preset="all">全选</button><button type="button" class="btn" data-preset="none">清空</button></div>
          <div class="pick"></div>
          <p class="readout" aria-live="polite"></p>
          <div class="out"></div>
        </div>
      </div>
    </figure>
    <p><button class="try" data-target="#note-win" data-set='{"preset":"dev"}'>只要开发环境</button><button class="try" data-target="#note-win" data-set='{"on":["local","noupd","nopwd"]}'>只改系统设置</button></p>
  </div>
