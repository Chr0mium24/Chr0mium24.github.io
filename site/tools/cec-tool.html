<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEC 工具 (时间同步版)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont/lxgwwenkaigbscreen.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      /* 和主站同一套：米色纸、文楷标题、红色 = 能点 */
      :root { --bg: #f6f3ea; --panel: #fffdf7; --ink: #26231e; --ink2: #5b564c; --mute: #8b857a; --line: #e0d9c9; --hand: #c92a2a; --ok: #0f8a6a;
        --kai: 'LXGW WenKai Screen', 'Kaiti SC', serif; --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
      * { box-sizing: border-box; }
      body { font: 16px/1.7 var(--sans); background: var(--bg); color: var(--ink); margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; position: relative; -webkit-font-smoothing: antialiased; }
      .home { align-self: stretch; max-width: 500px; width: 100%; margin: 0 auto 14px; font-family: var(--kai); font-size: 1.15rem; letter-spacing: .06em; color: var(--ink); text-decoration: none; }
      .home:hover { color: var(--hand); }
      .container { width: 100%; max-width: 500px; background: var(--panel); padding: 22px 22px 18px; border: 1px solid var(--line); border-radius: 12px; z-index: 2; position: relative; }
      h2 { font-family: var(--kai); font-weight: 400; font-size: 1.6rem; letter-spacing: .04em; margin: 0 0 12px; }

      /* 扫描区域 */
      #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; min-height: 0; background: #efeadd; display: none; }
      #reader.active { display: block; min-height: 250px; }

      /* 按钮：主按钮实心红，次要的描边 */
      .btn { display: block; width: 100%; padding: 11px 12px; margin: 10px 0; border: 1px solid color-mix(in srgb, var(--hand) 40%, transparent); border-radius: 999px; font: 15px/1.4 var(--sans); cursor: pointer; background: transparent; color: var(--hand); transition: background .2s, color .2s, border-color .2s; }
      .btn:hover { border-color: var(--hand); }
      .btn-success { background: var(--hand); border-color: var(--hand); color: #fff; }
      .btn-success:hover { background: color-mix(in srgb, var(--hand) 88%, black); }
      .btn-primary { background: transparent; }
      .btn-primary:hover { background: color-mix(in srgb, var(--hand) 6%, transparent); }
      .btn-secondary { color: var(--ink2); border-color: var(--line); }
      .btn-secondary:hover { color: var(--hand); border-color: var(--hand); }

      /* 二维码展示区 */
      .qr-section { text-align: center; padding: 18px 0; border-bottom: 1px dashed var(--line); }
      .qr-title { font-size: 13px; color: var(--mute); margin-bottom: 10px; letter-spacing: .05em; }
      .qr-holder { display: flex; justify-content: center; margin-bottom: 10px; }
      .qr-holder img, .qr-holder canvas { border-radius: 6px; }
      .token-info { font: 12px/1.5 'SF Mono', Menlo, monospace; color: var(--mute); margin-top: 5px; }

      /* 提示框 */
      .alert-warning { background: color-mix(in srgb, var(--hand) 5%, var(--panel)); color: var(--ink2); border: 1px solid var(--line); border-left: 3px solid var(--hand); padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; text-align: left; }

      /* 刷新进度（JS 驱动宽度） */
      .progress-wrapper { width: 180px; height: 5px; background: #ece6d8; border-radius: 3px; margin: 10px auto; overflow: hidden; }
      .progress-bar { height: 100%; background: var(--ok); width: 0%; border-radius: 3px; transition: width .1s linear; }

      #file-input { display: none; }
      .info-text { font-size: 13px; color: var(--mute); margin: 10px 0; text-align: center; }
      .info-text strong { color: var(--ink2); font-weight: 600; }
      canvas { max-width: 100%; }

      /* 拖拽遮罩 */
      #drag-overlay { position: fixed; inset: 0; background: rgba(246, 243, 234, .94); z-index: 10; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--hand); font: 22px/1.5 var(--kai); border: 3px dashed var(--hand); box-sizing: border-box; }

      @media (prefers-reduced-motion: no-preference) {
        .container { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
      }
    </style>
  </head>
  <body>
    <a class="home" href="/">Cr's Blog</a>
    <!-- 拖拽提示层 -->
    <div id="drag-overlay" style="display: none">
      <div>📂 释放动态二维码图片以识别</div>
    </div>

    <div class="container">
      <div id="scan-view">
        <h2>CEC工具</h2>

        <!-- 摄像头区域 -->
        <div id="reader"></div>

        <button
          id="btn-start-scan"
          class="btn btn-success"
          onclick="startCamera()"
        >
          📷 相机扫描动态二维码
        </button>
        <button
          id="btn-stop-scan"
          class="btn btn-secondary"
          onclick="stopCamera()"
          style="display: none"
        >
          ⏹ 停止扫描
        </button>

        <div style="height: 1px; background: #eee; margin: 15px 0"></div>

        <button
          class="btn btn-primary"
          onclick="document.getElementById('file-input').click()"
        >
          📁 上传动态二维码识别
        </button>
        <input type="file" id="file-input" accept="image/*" />

        <p class="info-text">
          支持 <strong>Ctrl+V</strong> 粘贴图片<br />
          或将图片 <strong>拖拽</strong> 到此页面
        </p>
      </div>

      <div id="generate-view" style="display: none">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <h2>本地模拟生成</h2>
          <button
            class="btn btn-secondary"
            style="width: auto; padding: 5px 15px; font-size: 14px"
            onclick="resetScan()"
          >
            返回
          </button>
        </div>

        <!-- 降级警告提示 -->
        <div id="legacy-warning" class="alert-warning">
          <strong>⚠️ 注意：</strong>
          检测到旧链接，未包含初始扫描时间。系统将使用当前时间作为基准，可能与服务器时间存在相位偏差。
        </div>

        <div class="qr-section">
          <div class="qr-title">1. 课程详情码 (Static)</div>
          <div id="static-qrcode" class="qr-holder"></div>
        </div>

        <div class="qr-section" style="border-bottom: none">
          <div class="qr-title">2. 动态签到码 (5s 刷新 / 自动对齐)</div>
          <div id="dynamic-qrcode" class="qr-holder"></div>

          <!-- 进度条 -->
          <div class="progress-wrapper">
            <div id="token-progress" class="progress-bar"></div>
          </div>

          <div id="token-text" class="token-info">Waiting...</div>
        </div>

        <button class="btn btn-primary" onclick="copyCurrentUrl()">
          🔗 复制此页面链接
        </button>
      </div>
    </div>

    <script>
      let html5QrCode;
      let refreshTimer = null; // 用于高频刷新的定时器
      let isScanning = false;
      let lastGeneratedToken = ""; // 记录上一次生成的Token，防止重复渲染

      // --- 初始化与路由 ---
      window.addEventListener("load", handleRouting);
      window.addEventListener("hashchange", handleRouting);

      function handleRouting() {
        const params = getHashParams();
        if (params.id && params.dataId) {
          showGenerateView(params);
        } else {
          showScanView();
        }
      }

      // --- 视图切换 ---
      function showScanView() {
        document.getElementById("scan-view").style.display = "block";
        document.getElementById("generate-view").style.display = "none";
        stopDynamicRefresh();
        stopCamera();
      }

      function showGenerateView(params) {
        document.getElementById("scan-view").style.display = "none";
        document.getElementById("generate-view").style.display = "block";
        stopCamera();

        // 生成静态详情码
        const staticUrl = `https://cesp.cuhk.edu.cn/qrcode?hkuType=${params.hkuType}&scene=lectureDetail&lectureId=${params.id}`;
        renderQr("static-qrcode", staticUrl);

        // 启动动态刷新
        startDynamicRefresh(params);
      }

      // --- 扫描相关逻辑 ---
      async function startCamera() {
        if (isScanning) return;

        const readerDiv = document.getElementById("reader");
        readerDiv.classList.add("active");

        document.getElementById("btn-start-scan").style.display = "none";
        document.getElementById("btn-stop-scan").style.display = "block";

        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
          );
          isScanning = true;
        } catch (err) {
          console.error(err);
          alert("摄像头启动失败，请确保授予权限或使用HTTPS协议。");
          stopCamera();
        }
      }

      function stopCamera() {
        if (html5QrCode && isScanning) {
          html5QrCode
            .stop()
            .then(() => {
              html5QrCode.clear();
              isScanning = false;
              document.getElementById("reader").classList.remove("active");
              document.getElementById("btn-start-scan").style.display = "block";
              document.getElementById("btn-stop-scan").style.display = "none";
            })
            .catch((err) => console.log("停止失败", err));
        }
      }

      function onScanSuccess(decodedText) {
        try {
          const url = new URL(decodedText);
          const p = new URLSearchParams(url.search);
          if (p.get("scene") === "signInOut") {
            // [新增] 获取当前时间作为 startTime，确保后续生成基于此时间点
            const now = Date.now();
            const newHash = `hkuType=${p.get("hkuType")}&dataId=${p.get("dataId")}&id=${p.get("id")}&startTime=${now}`;
            window.location.hash = newHash;
          } else {
            alert("识别成功，但不是有效的动态签到码 (scene!=signInOut)");
          }
        } catch (e) {
          alert("无效的链接: " + decodedText);
        }
      }

      // --- 文件/粘贴/拖拽识别核心 ---
      function scanImageFile(file) {
        if (!file) return;
        const scanner = new Html5Qrcode("reader");
        scanner
          .scanFile(file, true)
          .then((decodedText) => {
            onScanSuccess(decodedText);
          })
          .catch((err) => {
            alert("无法识别图片中的二维码，请确保图片清晰且包含完整二维码。");
            console.error(err);
          });
      }

      document.getElementById("file-input").addEventListener("change", (e) => {
        if (e.target.files.length > 0) scanImageFile(e.target.files[0]);
      });

      document.addEventListener("paste", (e) => {
        if (document.getElementById("scan-view").style.display === "none")
          return;
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.kind === "file" && item.type.startsWith("image/")) {
            scanImageFile(item.getAsFile());
            e.preventDefault();
            return;
          }
        }
      });

      const dragOverlay = document.getElementById("drag-overlay");
      let dragCounter = 0;

      window.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragCounter++;
        if (document.getElementById("scan-view").style.display !== "none") {
          dragOverlay.style.display = "flex";
        }
      });

      window.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter === 0) {
          dragOverlay.style.display = "none";
        }
      });

      window.addEventListener("dragover", (e) => e.preventDefault());

      window.addEventListener("drop", (e) => {
        e.preventDefault();
        dragCounter = 0;
        dragOverlay.style.display = "none";
        if (document.getElementById("scan-view").style.display === "none")
          return;
        if (e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          if (file.type.startsWith("image/")) {
            scanImageFile(file);
          } else {
            alert("请拖入动态二维码图片文件");
          }
        }
      });

      // --- 生成逻辑 (核心修改区) ---
      function renderQr(elementId, text) {
        const container = document.getElementById(elementId);
        container.innerHTML = "";
        new QRCode(container, {
          text: text,
          width: 180,
          height: 180,
          correctLevel: QRCode.CorrectLevel.L,
        });
      }

      function startDynamicRefresh(params) {
        const container = document.getElementById("dynamic-qrcode");
        const tokenText = document.getElementById("token-text");
        const progressBar = document.getElementById("token-progress");
        const warningBox = document.getElementById("legacy-warning");

        // 1. 确定基准时间
        let baseTime;
        if (params.startTime) {
          baseTime = parseInt(params.startTime);
          warningBox.style.display = "none"; // 隐藏警告
        } else {
          // 降级处理：没有startTime参数
          baseTime = Date.now();
          warningBox.style.display = "block"; // 显示警告
        }

        lastGeneratedToken = ""; // 重置状态

        // 2. 启动高频检测 (每50ms运行一次，保证进度条平滑且Token切换精准)
        if (refreshTimer) clearInterval(refreshTimer);

        refreshTimer = setInterval(() => {
          const now = Date.now();
          // 计算距离基准时间过去了多少毫秒
          const elapsed = now - baseTime;
          // 防止时间回调导致负数 (虽然极少见)
          const validElapsed = Math.max(0, elapsed);

          // A. 进度条计算
          // 取余数：在当前的 5s 周期内跑了多少毫秒
          const remainder = validElapsed % 5000;
          const percent = (remainder / 5000) * 100;
          progressBar.style.width = percent + "%";

          // B. Token 计算
          // 计算当前是第几个 5s 周期
          const steps = Math.floor(validElapsed / 5000);
          // 当前周期对应的目标 Token 时间戳
          const currentTokenTime = baseTime + steps * 5000;
          // 转 36 进制
          const token = currentTokenTime.toString(36);

          // C. 只有当 Token 发生变化时才重新渲染 QR
          if (token !== lastGeneratedToken) {
            const dynamicUrl = `https://cesp.cuhk.edu.cn/qrcode?scene=signInOut&hkuType=${params.hkuType}&dataId=${params.dataId}&id=${params.id}&token=${token}`;

            container.innerHTML = "";
            new QRCode(container, {
              text: dynamicUrl,
              width: 180,
              height: 180,
              correctLevel: QRCode.CorrectLevel.L,
            });

            // 格式化时间显示
            const d = new Date(currentTokenTime);
            const timeStr = `${d.getHours().toString().padStart(2, "0")}:${d.getMinutes().toString().padStart(2, "0")}:${d.getSeconds().toString().padStart(2, "0")}`;

            tokenText.innerText = `Token: ${token} (${timeStr})`;
            lastGeneratedToken = token;
          }
        }, 50); // 50ms 刷新率
      }

      function stopDynamicRefresh() {
        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }
        document.getElementById("token-progress").style.width = "0%";
      }

      // --- 工具函数 ---
      function getHashParams() {
        const hash = window.location.hash.substring(1);
        const params = {};
        if (!hash) return params;
        hash.split("&").forEach((pair) => {
          const [key, value] = pair.split("=");
          if (key) params[key] = value;
        });
        return params;
      }

      function resetScan() {
        window.location.hash = "";
      }

      function copyCurrentUrl() {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert("✅ 链接已复制！(包含初始时间参数)");
        });
      }
    </script>
  </body>
  <div id="immersive-translate-popup" style="all: initial"></div>
</html>
