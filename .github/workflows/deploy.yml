name: Deploy to GitHub Pages

# 站点是手写的静态文件，不用构建：把 site/ 原样发到 GitHub Pages。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JS syntax
        run: find site -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
